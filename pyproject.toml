[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-stock-transformer"
dynamic = ["version"]
description = "Multi-Token Prediction (MTP) Transformer for multi-horizon stock forecasting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["transformer", "multi-token-prediction", "stock-forecasting", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2.40",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mtp-download = "mtp.cli.download_data:main"
mtp-train = "mtp.cli.train:main"
mtp-evaluate = "mtp.cli.evaluate:main"
mtp-predict = "mtp.cli.predict:main"
mtp-backtest = "mtp.cli.backtest:main"

[tool.setuptools]
packages = ["mtp", "mtp.cli"]

[tool.setuptools.package-data]
"mtp.cli" = ["*.txt"]

[tool.setuptools.dynamic]
version = { attr = "mtp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
